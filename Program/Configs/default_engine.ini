; for App
[DefaultApp]
Editor = True
ClientWidth = 1280
ClientHeight = 720

; for Agl module
[DefaultAgl]
Type = AglType::D3D12
BufferCount = 2
UseBindless = True
GpuValidationEnabled = False

; for Logic module
[DefaultLogic]
DefaultWorld = ./Scene/RSMsScene.json
SaveLastWorldAsDefault = True

; for RenderCore module
[DefaultRenderCore]
UseVSync = False
AllowTearing = True
DefaultBackgroundColor = { 0, 0, 0, 1 }
; PIX
EnablePIX = True

; Temporal Anti-Aliasing
EnableTAA = True

; Exponential Shadow Maps
EnableESMs = True
ESMsParamC = 80

; Reflective Shadow Maps
EnableRSMs = True
RSMsNumSampling = 128
RSMsMaxSampleRadius = 0.2

; Irradiance Maps
UseIrradianceMapSH = True

; Light Propagation Volume
EnableLPV = True
NumLPVIteration = 8

; SSGI
EnableSSGI = True
ThicknessSSGI = 1.0
ViewSpaceRadiusSSGI = 30
NumSlicesSSGI = 8
NumStepsSSGI = 8
ColorIntensitySSGI = 1.0
DenoiseKernelRadiusSSGI = 8

; Visiblity Rendering
EnableVisibilityRendering = True